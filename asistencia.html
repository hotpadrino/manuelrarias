<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asistencia Institucional</title>
    
    <!-- Framework CSS (Bootstrap 5) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Librerías de Supabase y Exportación -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <style>
        /* Estilos generales de la aplicación */
        body { background-color: #f4f6f9; }
        
        /* Estilos del área de firma */
        #firma-pad { 
            touch-action: none; /* Previene scroll en móviles al firmar */
            border: 2px dashed #adb5bd !important; 
            cursor: crosshair; 
        }
        
        /* Control de navegación entre vistas */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* Reglas estrictas para impresión (Formato Limpio) */
        @media print {
            body { background-color: #fff; margin: 0; }
            .no-print, .container nav, #auth-section, header { display: none !important; }
            #documento-impresion { 
                border: none !important; 
                box-shadow: none !important; 
                width: 100%; 
                margin: 0; 
                padding: 0; 
            }
            .table { width: 100% !important; font-size: 10pt; }
            .firma-img { max-height: 40px; }
            .btn-eliminar { display: none !important; } 
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

<!-- ==========================================
     MÓDULO DE AUTENTICACIÓN
=========================================== -->
<div id="auth-section" class="container mt-5">
    <div class="card mx-auto shadow-sm" style="max-width: 450px;">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">Acceso Institucional</h4>
            
            <!-- Pestañas Login / Registro -->
            <ul class="nav nav-tabs mb-3" id="authTabs">
                <li class="nav-item">
                    <a class="nav-link active" href="#" id="tab-login" onclick="toggleAuth('login')">Ingresar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="tab-register" onclick="toggleAuth('register')">Nuevo Administrador</a>
                </li>
            </ul>

            <!-- Formulario de Ingreso -->
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                <div class="mt-3 text-center">
                    <a href="#" onclick="recuperarPassword()">¿Olvidó su contraseña?</a>
                </div>
            </form>

            <!-- Formulario de Registro (Oculto por defecto) -->
            <form id="register-form" class="d-none">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" id="reg-nombre" class="form-control" placeholder="Ej: Mayor Juan Pérez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" id="reg-password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
            </form>
        </div>
    </div>
</div>

<!-- ==========================================
     MÓDULO PRINCIPAL DE LA APLICACIÓN
=========================================== -->
<div id="main-section" class="container mt-4 d-none">
    
    <!-- Encabezado superior -->
    <header class="d-flex justify-content-between align-items-center mb-4 no-print border-bottom pb-3">
        <h2 class="m-0 text-dark">Panel de Asistencia</h2>
        <div class="d-flex align-items-center">
            <span id="user-display-name" class="me-3 fw-bold text-secondary"></span>
            <button id="btn-logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>
    </header>

    <!-- Botones de Navegación -->
    <nav class="mb-4 no-print d-flex gap-2">
        <button class="btn btn-success" onclick="showView('crear-reunion')">Crear Asistencia</button>
        <button class="btn btn-info text-white" onclick="showView('reportar-asistente')">Reportar Asistente</button>
        <button class="btn btn-secondary" onclick="showView('ver-asistencia')">Visualizar Asistencia</button>
    </nav>

    <!-- --------------------------------------
         VISTA 1: CREAR REUNIÓN
    --------------------------------------- -->
    <div id="crear-reunion" class="view-section active">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white fw-bold">Nueva Asistencia Institucional</div>
            <div class="card-body">
                <div class="alert alert-success d-none text-center fs-5" id="codigo-generado-alert"></div>
                
                <form id="form-reunion">
                    <div class="row">
                        <div class="col-md-4 mb-3"><label class="form-label">Fecha</label><input type="date" id="r-fecha" class="form-control" required></div>
                        <div class="col-md-8 mb-3"><label class="form-label">Tema</label><input type="text" id="r-tema" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Oficina Productora</label><input type="text" id="r-oficina" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Lugar</label><input type="text" id="r-lugar" class="form-control" required></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Hora Inicio</label><input type="time" id="r-inicio" class="form-control" required></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Hora Fin</label><input type="time" id="r-fin" class="form-control" required></div>
                        <div class="col-md-12 mb-3"><label class="form-label">Observaciones</label><textarea id="r-obs" class="form-control" rows="2"></textarea></div>
                    </div>
                    <button type="submit" class="btn btn-success btn-lg mt-2">Guardar y Generar Código</button>
                </form>
            </div>
        </div>
    </div>

    <!-- --------------------------------------
         VISTA 2: REPORTAR ASISTENTE
    --------------------------------------- -->
    <div id="reportar-asistente" class="view-section">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-info text-white fw-bold">Registro de Asistente</div>
            <div class="card-body">
                <form id="form-asistente">
                    <div class="row mb-4 bg-light p-3 rounded border">
                        <div class="col-md-6 mb-2 mb-md-0"><label class="form-label">Fecha del Evento</label><input type="date" id="a-fecha" class="form-control" required></div>
                        <div class="col-md-6"><label class="form-label">Código de Control</label><input type="text" id="a-codigo" class="form-control" maxlength="4" placeholder="Ej: 5847" pattern="\d{4}" title="Debe ser un número de 4 dígitos" required></div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-2 mb-3"><label class="form-label">Grado</label><input type="text" id="a-grado" class="form-control" required></div>
                        <div class="col-md-10 mb-3"><label class="form-label">Nombres y Apellidos</label><input type="text" id="a-nombres" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Cargo</label><input type="text" id="a-cargo" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Dependencia</label><input type="text" id="a-dep" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Teléfono</label><input type="tel" id="a-tel" class="form-control"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="a-correo" class="form-control"></div>
                    </div>
                    
                    <!-- Lienzo de Firma Digital -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Firma Digital (Diligencie dentro del recuadro)</label>
                        <canvas id="firma-pad" class="border rounded d-block bg-white w-100" height="200"></canvas>
                        <div class="mt-2 text-end">
                            <button type="button" class="btn btn-sm btn-outline-warning" onclick="limpiarFirma()">Borrar Firma</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-info text-white btn-lg w-100">Guardar Asistencia</button>
                </form>
            </div>
        </div>
    </div>

    <!-- --------------------------------------
         VISTA 3: VISUALIZAR Y EXPORTAR
    --------------------------------------- -->
    <div id="ver-asistencia" class="view-section">
        
        <!-- Buscador -->
        <div class="row mb-4 no-print align-items-end bg-white p-3 rounded shadow-sm border">
            <div class="col-md-4 mb-2 mb-md-0">
                <label class="form-label">Fecha de la Reunión</label>
                <input type="date" id="v-fecha" class="form-control">
            </div>
            <div class="col-md-4 mb-2 mb-md-0">
                <label class="form-label">Código de Control</label>
                <input type="text" id="v-codigo" class="form-control" maxlength="4" placeholder="Ej: 5847">
            </div>
            <div class="col-md-4">
                <button class="btn btn-secondary w-100" onclick="buscarAsistencia()">Buscar Lista</button>
            </div>
        </div>
        
        <!-- Botones de Acción / Exportación -->
        <div class="mb-3 no-print text-end d-none" id="export-buttons">
            <button class="btn btn-danger me-1" onclick="exportarPDF()">PDF</button>
            <button class="btn btn-success me-1" onclick="exportarExcel()">Excel</button>
            <button class="btn btn-dark" onclick="window.print()">Imprimir</button>
        </div>

        <!-- Contenedor Final para Renderizado -->
        <div id="documento-impresion" class="bg-white p-4 shadow-sm rounded border d-none">
            <div id="reporte-content">
                <!-- JavaScript inyectará aquí los encabezados de la reunión y la tabla HTML de asistentes -->
            </div>
        </div>
    </div>

</div>

<!-- Enlace al archivo lógico -->
<script src="js/app.js"></script>
</body>
</html>
