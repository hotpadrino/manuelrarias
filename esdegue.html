<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparación Examen ESDEGUE</title>

<script>
/* Aplica el tema guardado antes de pintar para evitar parpadeos */
(function(){
  try{
    var t = localStorage.getItem('esdegue_theme');
    if(!t){ t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>

<style>
:root{
  --bg:#eef2f8;
  --card:#ffffff;
  --soft:#f1f5fa;
  --text:#1b2433;
  --muted:#5b6678;
  --primary:#0f4c81;
  --primary-2:#1d72b8;
  --primary-tint:#e3eefa;
  --on-primary:#ffffff;
  --border:#d9e1ec;
  --ok:#15803d;
  --ok-tint:#dcfce7;
  --bad:#b91c1c;
  --bad-tint:#fee2e2;
  --warn:#f5b301;
  --warn-ink:#3b2a00;
  --pend:#e2e8f0;
  --pend-ink:#334155;
  --shadow:0 1px 2px rgba(15,35,70,.06), 0 8px 24px rgba(15,35,70,.07);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#0d1420;
  --card:#162033;
  --soft:#1d2a40;
  --text:#e8eef7;
  --muted:#9db0c8;
  --primary:#2f6fbd;
  --primary-2:#6aaaf0;
  --primary-tint:#1b3250;
  --on-primary:#ffffff;
  --border:#2a3a55;
  --ok:#16a34a;
  --ok-tint:#12341f;
  --bad:#dc2626;
  --bad-tint:#3b1717;
  --warn:#f5b301;
  --warn-ink:#2b2000;
  --pend:#2a3a55;
  --pend-ink:#cbd5e1;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
  transition:background .3s,color .3s;
}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--primary-2);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:8px;z-index:300}
.skip:focus{left:8px}

/* ---------- Encabezado ---------- */
.app-header{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px clamp(14px,3vw,32px);
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 12px rgba(15,35,70,.05);
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:60px;height:60px;object-fit:contain;flex:none}
.brand h1{font-size:clamp(1.05rem,2.6vw,1.6rem);letter-spacing:.2px;line-height:1.15;color:var(--primary)}
[data-theme="dark"] .brand h1{color:var(--primary-2)}
.subtitle{color:var(--muted);font-size:.9rem}
.header-actions{display:flex;align-items:center;gap:10px;flex:none}
.timer{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:12px;
  background:var(--soft);border:1px solid var(--border);
  font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;
}
.timer .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.timer.running{background:var(--primary-tint);border-color:var(--primary-2)}
.timer.running .dot{background:var(--ok);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.icon-btn{
  width:44px;height:44px;border-radius:12px;font-size:1.25rem;
  background:var(--primary);color:var(--on-primary);
  transition:transform .15s,filter .15s;
}
.icon-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* ---------- Contenedores ---------- */
.container{max-width:1180px;margin:0 auto;padding:22px clamp(14px,3vw,28px) 10px}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:clamp(16px,3vw,28px);
}
.card h2{font-size:1.15rem}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:20px;align-items:start}
aside{display:grid;gap:20px}
.stack{display:grid;gap:18px}

/* ---------- Configuración: modo y temas ---------- */
.setup{display:grid;gap:18px}
.setup-row{display:grid;gap:10px}
.setup-label{font-weight:700;font-size:.95rem}
.modes{border:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mode{position:relative;display:block;cursor:pointer}
.mode input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.mode .box{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 16px;border:2px solid var(--border);border-radius:14px;
  background:var(--card);transition:border-color .2s,background .2s,box-shadow .2s;
}
.mode .radio{flex:none;margin-top:3px;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.mode .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary-2);transform:scale(0);transition:transform .2s}
.mode input:checked + .box{border-color:var(--primary-2);background:var(--primary-tint)}
.mode input:checked + .box .radio{border-color:var(--primary-2)}
.mode input:checked + .box .radio::after{transform:scale(1)}
.mode input:focus-visible + .box{outline:3px solid var(--primary-2);outline-offset:2px}
.mode input:disabled + .box{opacity:.6;cursor:not-allowed}
.mode small{display:block;color:var(--muted);font-size:.85rem}
.mode b{display:block}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tab-btn{
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px 16px;border-radius:14px;
  background:var(--card);border:2px solid var(--border);
  transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;
}
.tab-btn:hover{border-color:var(--primary-2);transform:translateY(-1px)}
.tab-btn .ico{font-size:1.5rem}
.tab-btn .t{font-weight:700;display:block;line-height:1.2}
.tab-btn .n{font-size:.82rem;color:var(--muted)}
.tab-btn.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 6px 18px rgba(15,76,129,.35)}
.tab-btn.active .n{color:rgba(255,255,255,.85)}

/* ---------- Pantalla de inicio ---------- */
.hero{text-align:center;padding:clamp(24px,6vw,56px) 10px}
.hero .big{font-size:3rem;margin-bottom:6px}
.hero h2{font-size:clamp(1.4rem,3.5vw,2rem);color:var(--primary)}
[data-theme="dark"] .hero h2{color:var(--primary-2)}
.hero p{color:var(--muted);max-width:52ch;margin:10px auto 0}

/* ---------- Examen ---------- */
.q-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--primary-tint);color:var(--primary);border:1px solid var(--border)}
[data-theme="dark"] .chip{color:var(--primary-2)}
.progress-meta{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;font-size:.95rem}
.progress{height:14px;border-radius:999px;background:var(--pend);overflow:hidden;margin-bottom:22px}
.progress-bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .4s ease}
.question{font-size:clamp(1.1rem,2.4vw,1.35rem);font-weight:600;margin-bottom:18px;line-height:1.4;outline:none}
.options{display:grid;gap:10px}
.option{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;border-radius:14px;
  border:2px solid var(--border);background:var(--card);color:var(--text);
  transition:border-color .2s,background .25s,color .25s,transform .15s;
}
.option .letter{
  flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;background:var(--soft);color:var(--primary);transition:background .25s,color .25s;
}
[data-theme="dark"] .option .letter{color:var(--primary-2)}
.option .txt{padding-top:3px}
.option:hover:not([aria-disabled="true"]){border-color:var(--primary-2);transform:translateY(-1px)}
.option[aria-disabled="true"]{cursor:default}
.option.sel{border-color:var(--primary-2);background:var(--primary-tint)}
.option.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.option.ok .letter{background:rgba(255,255,255,.25);color:#fff}
.option.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.option.bad .letter{background:rgba(255,255,255,.25);color:#fff}
.option.dim{opacity:.6}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-weight:600;border:1px solid var(--border);background:var(--soft)}
.feedback.ok{background:var(--ok-tint);border-color:var(--ok);color:var(--text)}
.feedback.bad{background:var(--bad-tint);border-color:var(--bad);color:var(--text)}
.feedback.info{font-weight:500;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
.actions .group{display:flex;flex-wrap:wrap;gap:10px}
.btn{
  padding:11px 18px;border-radius:12px;font-weight:600;
  border:2px solid var(--border);background:var(--card);
  transition:transform .15s,filter .15s,border-color .2s,background .2s;
}
.btn:hover:not(:disabled){border-color:var(--primary-2);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
[data-theme="dark"] .btn.danger{color:#fca5a5;border-color:#7f1d1d}
.btn.mark.on{background:var(--warn);border-color:var(--warn);color:var(--warn-ink)}
.hint{margin-top:14px;color:var(--muted);font-size:.82rem}

/* ---------- Navegación rápida y filtros ---------- */
.nav-block{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}
.nav-block h3{font-size:.95rem;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filter{padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;border:1.5px solid var(--border);background:var(--card);transition:background .2s,border-color .2s}
.filter:hover:not(:disabled){border-color:var(--primary-2)}
.filter.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.filter:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:8px}
.qn{
  width:42px;height:42px;border-radius:10px;font-weight:700;
  background:var(--pend);color:var(--pend-ink);
  transition:transform .15s,background .2s;
}
.qn:hover{transform:translateY(-2px)}
.qn.done{background:var(--ok);color:#fff}
.qn.bad{background:var(--bad);color:#fff}
.qn.marked{background:var(--warn);color:var(--warn-ink)}
.qn.marked.done{box-shadow:inset 0 -5px 0 var(--ok)}
.qn.current{outline:3px solid var(--primary-2);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{color:var(--muted);padding:8px 0}

/* ---------- Resultados ---------- */
.result-head{text-align:center;margin-bottom:20px}
.result-head h2{font-size:1.5rem}
.score{font-size:clamp(3rem,10vw,4.5rem);font-weight:800;line-height:1;margin:10px 0;color:var(--primary)}
[data-theme="dark"] .score{color:var(--primary-2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.metric{padding:14px;border-radius:14px;background:var(--soft);border:1px solid var(--border);text-align:center}
.metric b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:.85rem}
.metric.ok b{color:var(--ok)}
.metric.bad b{color:var(--bad)}
[data-theme="dark"] .metric.ok b{color:#4ade80}
[data-theme="dark"] .metric.bad b{color:#f87171}
.record{padding:14px 16px;border-radius:12px;background:var(--primary-tint);border:1px solid var(--primary-2);margin-bottom:20px;text-align:center;font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:8px}
.chart-box{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--card)}
.chart-box h3{font-size:.95rem;margin-bottom:8px}
canvas{display:block;width:100%;height:230px}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.85rem;margin-top:6px}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.review{display:grid;gap:10px}
.rev-item{padding:14px 16px;border-radius:12px;border:1px solid var(--border);border-left:6px solid var(--pend);background:var(--card)}
.rev-item.ok{border-left-color:var(--ok)}
.rev-item.bad{border-left-color:var(--bad)}
.rev-item .qt{font-weight:600;margin-bottom:6px}
.rev-item .ans{font-size:.92rem}
.rev-item .good-t{color:var(--ok);font-weight:600}
.rev-item .bad-t{color:var(--bad);font-weight:600}
[data-theme="dark"] .rev-item .good-t{color:#4ade80}
[data-theme="dark"] .rev-item .bad-t{color:#f87171}
.rev-item .pend-t{color:var(--muted);font-weight:600}

/* ---------- Estadísticas / banco ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kpi{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.srow{padding:12px 0;border-top:1px solid var(--border)}
.srow .name{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.srow .bar{height:8px;border-radius:99px;background:var(--pend);margin:8px 0 6px;overflow:hidden}
.srow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .5s}
.srow .meta{font-size:.82rem;color:var(--muted)}
.bank-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem;border-bottom:1px dashed var(--border)}
.bank-src{font-size:.82rem;color:var(--muted);margin:8px 0 12px}
.side-actions{display:grid;gap:10px;margin-top:14px}

.global-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

footer{margin-top:34px;text-align:center;padding:22px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:.92rem}
footer a{color:var(--primary-2);font-weight:600;text-decoration:none}
footer a:hover{text-decoration:underline}

/* ---------- Modal y aviso ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:500;background:rgba(8,15,30,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-backdrop[hidden]{display:none}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:26px;max-width:440px;width:100%;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:20px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--primary);color:var(--on-primary);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:600;max-width:92vw;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:920px){
  .layout{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand img{width:44px;height:44px}
  .subtitle{display:none}
  .timer{padding:8px 10px;font-size:.9rem}
  .actions{flex-direction:column}
  .actions .group{width:100%}
  .actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>

<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="app-header">
  <div class="brand">
    <img id="logo" src="https://esdegue.edu.co/sites/default/files/inline-images/escudo%20solo.png" alt="Escudo de ESDEGUE">
    <div>
      <h1>PREPARACIÓN EXAMEN ESDEGUE</h1>
      <div class="subtitle">Simulador interactivo de estudio y evaluación.</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="timer" id="timer"><span class="dot" aria-hidden="true"></span><span>⏱ Tiempo: <span id="timerValue">00:00:00</span></span></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar a tema oscuro" title="Cambiar tema">🌙</button>
  </div>
</header>

<main id="main" class="container">

  <section class="card setup" aria-label="Configuración del examen">
    <div class="setup-row">
      <span class="setup-label" id="modeLabel">1. Modo de examen</span>
      <fieldset class="modes" aria-labelledby="modeLabel">
        <label class="mode">
          <input type="radio" name="modo" value="practica" checked>
          <span class="box"><span class="radio" aria-hidden="true"></span>
            <span><b>Práctica</b><small>Muestra al instante si acertó y cuál era la respuesta correcta.</small></span>
          </span>
        </label>
        <label class="mode">
          <input type="radio" name="modo" value="simulacro">
          <span class="box"><span class="radio" aria-hidden="true"></span>
            <span><b>Simulacro</b><small>Sin respuestas durante el examen. Se califica al finalizar.</small></span>
          </span>
        </label>
      </fieldset>
    </div>
    <div class="setup-row">
      <span class="setup-label" id="tabsLabel">2. Tema (al elegirlo empieza el examen)</span>
      <div class="tabs" id="tabs" role="group" aria-labelledby="tabsLabel"></div>
    </div>
  </section>

  <div class="layout">
    <section id="stage" class="stack" aria-live="polite"></section>

    <aside>
      <section class="card" aria-labelledby="statsTitle">
        <h2 id="statsTitle">🏆 MEJORES RESULTADOS</h2>
        <div id="statsBody"></div>
        <div class="side-actions">
          <button class="btn danger" type="button" data-global="clearStats">🗑 Borrar estadísticas</button>
        </div>
      </section>

      <section class="card" aria-labelledby="bankTitle">
        <h2 id="bankTitle">📚 Banco de preguntas</h2>
        <div class="bank-src" id="bankSrc"></div>
        <div id="bankList"></div>
        <div class="side-actions">
          <button class="btn" type="button" data-global="loadFile">📂 Cargar Markdown</button>
          <button class="btn" type="button" data-global="resetBank">↩ Restaurar preguntas de ejemplo</button>
          <input type="file" id="fileInput" accept=".md,.txt,text/markdown,text/plain" hidden>
        </div>
      </section>
    </aside>
  </div>

  <div class="global-actions">
    <button class="btn primary" type="button" data-global="newExam">🔄 Nuevo examen</button>
  </div>
</main>

<footer>
  Preparación Examen ESDEGUE | Desarrollado por
  <a href="https://novaelix.vercel.app/" target="_blank" rel="noopener noreferrer">NovaElix</a>
</footer>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="modal-actions" id="mActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   BANCOS DE PREGUNTAS (3 por tema por defecto).
   Los bancos públicos se descubren en la raíz y se cargan al seleccionar.
   La importación manual y las preguntas de ejemplo siguen disponibles.
   ===================================================================== */
const bancosPreguntas = {
  estadoMayor: [
    { pregunta:"¿Cuál es la misión principal del Estado Mayor?",
      opciones:["Asesorar al comandante","Administrar contratos","Ejecutar auditorías","Realizar compras"],
      correcta:"Asesorar al comandante" },
    { pregunta:"¿Qué principio garantiza una autoridad única?",
      opciones:["Unidad de comando","Seguridad","Flexibilidad","Reserva"],

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];

  return `${h}:${m}:${s}`;
}

let modalPrev = null;
function ask(title, text, buttons, cancelValue){
  return new Promise(resolve=>{
    const modal = $('#modal'), box = modal.querySelector('.modal'), acts = $('#mActions');
    $('#mTitle').textContent = title;
    $('#mText').textContent = text;
    acts.innerHTML = '';
    modalPrev = document.activeElement;
    const close = v => {
      modal.hidden = true;
      document.removeEventListener('keydown', onKey, true);
      if(modalPrev && modalPrev.focus && document.body.contains(modalPrev)) modalPrev.focus({preventScroll:true});
      resolve(v);
    };
    buttons.forEach(b=>{
      const el = document.createElement('button');
      el.type='button'; el.className = 'btn' + (b.primary?' primary':'') + (b.danger?' danger':'');
      el.textContent = b.label;
      el.addEventListener('click', ()=>close(b.value));
      acts.appendChild(el);
    });
    function onKey(e){
      if(e.key==='Escape' && cancelValue!==undefined){ e.preventDefault(); close(cancelValue); }
      if(e.key==='Tab'){
        const f = box.querySelectorAll('button');
        if(!f.length) return;
        const first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener('keydown', onKey, true);
    modal.hidden = false;
    const primary = acts.querySelector('.primary') || acts.querySelector('button');
    primary.focus();
  });
}

/* ---------------- Banco: importación compatible del formato anterior ---------------- */
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[\s.;:,]+$/,'').replace(/\s+/g,' ').trim();
const limpiar = s => String(s).replace(/\*\*|__|`/g,'').trim();
function claveDeTitulo(t){
  const n = norm(t);
  if(n.includes('estado mayor')) return 'estadoMayor';
  if(n.includes('estrategia')) return 'estrategia';
  if(n.includes('geograf')) return 'geografia';
  if(n.includes('historia')) return 'historia';
  return null;
}
function parseBanco(texto){
  const out = {estadoMayor:[],estrategia:[],geografia:[],historia:[]};
  let cur = null, q = null, omitidas = 0;
  function cerrar(){
    if(q && cur){
      const enunciado = q.texto.join(' ').trim();
      let idx = -1;
      if(q.resp){
        const r = norm(q.resp);
        idx = q.ops.findIndex(o => norm(o)===r);
        if(idx<0){
          const m = q.resp.trim().match(/^([A-Ha-h])(?:[\)\.\s:-]|$)/);
          if(m && q.resp.trim().length<=3 && LETRAS.indexOf(m[1].toUpperCase())<q.ops.length)
            idx = LETRAS.indexOf(m[1].toUpperCase());
        }
      }
      if(enunciado && q.ops.length>=2 && idx>=0){
        out[cur].push({pregunta:enunciado, opciones:q.ops.slice(), correcta:q.ops[idx]});
      }else omitidas++;
    }
    q = null;
  }
  texto.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    let m;
    if((m = line.match(/^#\s+(.+)$/))){ cerrar(); cur = claveDeTitulo(m[1]); return; }
    if(/^#{2}\s*pregunta/i.test(line)){ cerrar(); q = {texto:[],ops:[],resp:null}; return; }
    if(!q) return;
    if(/^([-*_])\1{2,}$/.test(line)){ cerrar(); return; }
    if((m = line.match(/^respuesta(?:\s+correcta)?\s*:\s*(.+)$/i))){ q.resp = limpiar(m[1]); return; }
    if((m = line.match(/^[-*+]\s+(.*)$/)) || (m = line.match(/^[A-Ha-h][\)\.]\s+(.*)$/))){
      let o = limpiar(m[1]).replace(/^[A-Ha-h][\)\.]\s+/,'');
      if(o) q.ops.push(o);
      return;
    }
    if(line && !q.ops.length && q.resp===null) q.texto.push(limpiar(line));
  });
  cerrar();
  const total = Object.values(out).reduce((a,b)=>a+b.length,0);
  return {out, total, omitidas};
}
function aplicarBanco(out, origen, guardar){
  let cambios = 0;
  Object.keys(out).forEach(k=>{
    if(out[k].length){ bancosPreguntas[k] = out[k]; cambios++; }
  });
  if(cambios){
    bankSource = origen;
    if(guardar){ const ok = lsSet(KEYS.bank, out); if(!ok) toast('El banco se cargó, pero no pudo guardarse en este navegador.'); }
  }
  return cambios;
}
function renderBank(){

  $('#bankList').innerHTML = MATERIAS.map(m =>

function primeraLinea(texto){
  return texto.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/)[0].trim();
}
function parseMateria(texto){
  const lines = texto.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).slice(1)
    .map(l=>l.trim()).filter(Boolean);
  const out=[];
  const marker = l=> /^(?:#{1,6}\s*)?PREGUNTA\s*$/i.test(l);
  const cleanOption = l=>limpiar(l.replace(/^(?:[-*+]\s+|[A-D][.)]\s+)/i,''));
  for(let i=0;i<lines.length;i++){
    if(!marker(lines[i])) continue;
    const block=[];
    while(i+1<lines.length && !marker(lines[i+1])) block.push(lines[++i]);
    if(block.length!==6) throw new Error('Formato de pregunta inválido');
    const match=block[5].match(/^RESPUESTA\s*:\s*(.+)$/i);
    const opciones=block.slice(1,5).map(cleanOption);
    const respuesta=match && limpiar(match[1]);
    const correcta=opciones.find(o=>norm(o)===norm(respuesta||''));
    if(!match || !correcta || opciones.some(o=>!o) || new Set(opciones.map(norm)).size!==4)
      throw new Error('Respuesta u opciones inválidas');
    out.push({pregunta:limpiar(block[0]),opciones,correcta});
  }
  if(!out.length) throw new Error('Banco vacío');
  return out;
}

function rutaValida(valor){
  try{
    if(typeof valor!=='string') return null;
    // El manifiesto admite nombres y /nombres relativos a la raíz de la app.
    const entrada=/^\/esdegue_[a-z0-9_-]+\.md$/i.test(valor)?valor.slice(1):valor;

      && /^esdegue_[a-z0-9_-]+\.md$/i.test(nombre) && !u.search && !u.hash ? u.href : null;

async function consultarIndice(url, procesar){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),5000);
  try{
    const r=await fetch(url,{cache:'no-store',signal:controller.signal});
    if(r.ok) await procesar(r);
  }catch(e){}finally{clearTimeout(timer);}
}
async function descubrirRutas(){
  const rutas=new Set(ARCHIVOS_BASE);
  const agregar=v=>{const p=rutaValida(v);if(p) rutas.add(p);};
  const tareas=[
    consultarIndice(urlApp('esdegue_manifest.json'),async r=>{
      const data=await r.json();
      const files=Array.isArray(data)?data:data.archivos;
      if(Array.isArray(files)) files.forEach(agregar);
    }),
    consultarIndice(RAIZ_APP.href,async r=>{
      const doc=new DOMParser().parseFromString(await r.text(),'text/html');
      doc.querySelectorAll('a[href]').forEach(a=>agregar(a.getAttribute('href')));
    })
  ];
  // GitHub Pages: descubre archivos nuevos sin modificar el HTML ni un manifiesto.
  if(/^[a-z0-9-]+\.github\.io$/i.test(location.hostname)){
    const usuario=location.hostname.split('.')[0];
    const segmentos=RAIZ_APP.pathname.split('/').filter(Boolean).map(decodeURIComponent);
    const repo=segmentos.shift() || usuario+'.github.io';
    const carpeta=segmentos.map(encodeURIComponent).join('/');
    const endpoint='https://api.github.com/repos/'+encodeURIComponent(usuario)+'/'+encodeURIComponent(repo)+'/contents/'+carpeta;
    tareas.push(consultarIndice(endpoint,async r=>{
      const files=await r.json();
      if(Array.isArray(files)) files.filter(f=>f.type==='file').forEach(f=>agregar(f.name));
    }));
  }
  await Promise.all(tareas);
  const base=new Set(ARCHIVOS_BASE);
  return [...ARCHIVOS_BASE,...[...rutas].filter(p=>!base.has(p)).sort()];
}
async function leerTitulo(ruta){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  let reader;
  try{
    const r=await fetch(ruta,{headers:{Range:'bytes=0-4095'},cache:'no-store',signal:controller.signal});
    if(!r.ok || /text\/html/i.test(r.headers.get('content-type')||'')) return null;
    if(!r.body) return null;
    reader=r.body.getReader();
    const decoder=new TextDecoder(); let texto='';
    while(true){
      const {value,done}=await reader.read();
      texto+=done?decoder.decode():decoder.decode(value,{stream:true});
      if(/[\r\n]/.test(texto) || done || texto.length>4096) break;
    }
    const nombre=primeraLinea(texto);
    if(!nombre || nombre.length>500 || /[<>]/.test(nombre)) return null;
    const slug=new URL(ruta).pathname.split('/').pop().slice('esdegue_'.length,-3);
    const key=slug==='estado_mayor'?'estadoMayor':slug;
    return {key,nombre,icono:'',ruta};
  }catch(e){return null;}
  finally{
    if(reader) try{await reader.cancel();}catch(e){}
    controller.abort();clearTimeout(timer);
  }
}

    bankSource='Archivos independientes en la raíz · carga al seleccionar';

async function cargarMateria(key){
  if(cacheMaterias.has(key)) return cacheMaterias.get(key);
  if(cargasPendientes.has(key)) return cargasPendientes.get(key);
  const materia=MATERIAS.find(m=>m.key===key);
  if(!materia || !materia.ruta) throw new Error('Materia no disponible');
  const trabajo=(async()=>{
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),15000);
    try{
      const r=await fetch(materia.ruta,{cache:'no-store',signal:controller.signal});
      if(!r.ok || /text\/html/i.test(r.headers.get('content-type')||'')) throw new Error('Archivo no disponible');
      const texto=await r.text();
      const preguntas=parseMateria(texto);
      cacheMaterias.set(key,preguntas);
      bancosPreguntas[key]=preguntas;
      materia.nombre=primeraLinea(texto);
      return preguntas;
    }finally{clearTimeout(timer);}
  })();
  cargasPendientes.set(key,trabajo);
  try{return await trabajo;}finally{cargasPendientes.delete(key);}
}
async function cargarArchivo(file){
  if(seleccionando) return;
  try{
    const texto=await file.text();
    let entries;
    // Conserva la importación manual del formato anterior con varios temas.
    if((texto.match(/^##\s*PREGUNTA/gmi)||[]).length && (texto.match(/^#\s+/gm)||[]).length>1){
      const r=parseBanco(texto);
      if(!r.total) throw new Error('Banco vacío');
      entries=Object.entries(r.out).filter(([,qs])=>qs.length).map(([key,qs])=>({
        materia:{...MATERIAS_EJEMPLO.find(m=>m.key===key)},qs
      }));
    }else{
      const nombre=primeraLinea(texto);
      if(!nombre) throw new Error('Título vacío');
      const ruta=rutaValida('/'+file.name);
      const slug=ruta?file.name.slice(8,-3):null;
      const key=slug?(slug==='estado_mayor'?'estadoMayor':slug):'local_'+norm(nombre).replace(/[^a-z0-9]+/g,'_');
      entries=[{materia:{key,nombre,icono:''},qs:parseMateria(texto)}];
    }
    if(view==='exam'){
      const ok=await confirmar('¿Cargar otro banco?','Se cerrará el examen actual. Las estadísticas se conservan.','Cargar','Cancelar');
      if(!ok)return;
      stopTimer();S=null;lsDel(KEYS.session);view='home';resetTimer();
    }
    entries.forEach(({materia,qs})=>{
      MATERIAS=MATERIAS.filter(m=>m.key!==materia.key);MATERIAS.push(materia);
      bancosPreguntas[materia.key]=qs;cacheMaterias.set(materia.key,qs);
    });
    R=null;bankSource='Archivo «'+file.name+'»';
    lsSet(KEYS.bank,{v:2,materias:MATERIAS.filter(m=>!m.ruta).map(m=>({...m,preguntas:cacheMaterias.get(m.key)}))});
    toast('Banco cargado.');render();
  }catch(e){toast('No se pudo cargar el archivo. Revise su formato.');}
}

/* ---------------- Exámenes ---------------- */
const respondida = (E,i) => E.resp[i]!==null;
const esCorrecta = (E,i) => E.resp[i]!==null && E.preguntas[i].opciones[E.resp[i]]===E.preguntas[i].correcta;
const hayProgreso = E => E.resp.some(r=>r!==null);

function matches(E,i,f){
  if(f==='todas') return true;
  if(f==='incorrectas') return respondida(E,i) && !esCorrecta(E,i);
  if(f==='pendientes') return !respondida(E,i);
  if(f==='marcadas') return !!E.marks[i];
  return true;
}
const visibles = E => E.preguntas.map((_,i)=>i).filter(i=>matches(E,i,filtro));

async function iniciarExamen(materia, modo){
  try{ await cargarMateria(materia); }catch(e){ toast('No se pudo cargar esta materia. Inténtelo de nuevo.'); return; }
  const banco = bancosPreguntas[materia];
  if(!banco || !banco.length){ toast('Este tema no tiene preguntas.'); return; }
  const preguntas = shuffle(banco).map(q=>({
    pregunta:q.pregunta, opciones:shuffle(q.opciones), correcta:q.correcta
  }));
  S = {
    materia, modo, preguntas, idx:0,
    resp:preguntas.map(()=>null), marks:preguntas.map(()=>false)
  };
  R = null; filtro = 'todas'; view = 'exam';
  startTimer(0);
  saveSession();
  render('#qTitle');
}

async function elegirTema(key){
  if(seleccionando) return;
  seleccionando=true;
  try{
    if(view==='exam' && S.materia===key) return;
    if(view==='exam' && hayProgreso(S)){
      const ok=await confirmar('¿Cambiar de tema?','Perderá el progreso del examen en curso.','Cambiar de tema','Seguir aquí');
      if(!ok) return;
    }
    $('#tabs').setAttribute('aria-busy','true');
    try{await cargarMateria(key);}catch(e){toast('No se pudo cargar esta materia. Inténtelo de nuevo.');return;}
    if(view==='exam') stopTimer();
    await iniciarExamen(key,uiMode);
  }finally{seleccionando=false;$('#tabs').removeAttribute('aria-busy');}
}

async function nuevoExamen(){
  if(seleccionando) return;
  const materia = S ? S.materia : (R ? R.materia : null);
  if(!materia){ toast('Seleccione un tema para empezar.'); return; }
  if(view==='exam' && hayProgreso(S)){
    const ok = await confirmar('¿Nuevo examen?','Se reordenarán las preguntas y se reiniciarán tiempo y respuestas.','Nuevo examen','Cancelar');
    if(!ok) return;
  }
  if(view==='exam') stopTimer();
  iniciarExamen(materia, uiMode);
}

function elegir(oi){
  if(view!=='exam') return;
  if(S.modo==='practica' && S.resp[S.idx]!==null) return;     // ya contestada: bloqueada
  if(oi<0 || oi>=S.preguntas[S.idx].opciones.length) return;
  S.resp[S.idx] = oi;
  saveSession();
  if(S.modo==='practica') render('[data-action="next"]', true);
  else render(`[data-action="opt"][data-i="${oi}"]`, true);
  if(S.modo==='practica'){
    const f = $('#feedback'); if(f) f.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}
function irA(i){
  if(view!=='exam') return;
  S.idx = Math.max(0, Math.min(S.preguntas.length-1, i));
  saveSession();
  render('#qTitle');
  window.scrollTo({top:0,behavior:'smooth'});
}
function siguiente(){ const n = visibles(S).find(i=>i>S.idx); return n; }
function anterior(){ const v = visibles(S).filter(i=>i<S.idx); return v.length ? v[v.length-1] : undefined; }
function marcar(){
  if(view!=='exam') return;
  S.marks[S.idx] = !S.marks[S.idx];
  saveSession();
  render('[data-action="mark"]', true);
}

async function finalizar(){
  if(view!=='exam') return;
  const pend = S.resp.filter(r=>r===null).length;
  if(pend>0){
    const ok = await confirmar('¿Finalizar el examen?',
      `Tiene ${pend} pregunta${pend>1?'s':''} sin responder. Se calificarán como incorrectas.`, 'Finalizar','Seguir respondiendo');
    if(!ok) return;
  }
  stopTimer();
  const tiempo = elapsedSec();
  const n = S.preguntas.length;
  let ok=0, mal=0, sin=0;
  S.preguntas.forEach((_,i)=>{ if(!respondida(S,i)) sin++; else if(esCorrecta(S,i)) ok++; else mal++; });
  const pct = Math.round(ok/n*100);

  const st = loadStats();
  const x = st.materias[S.materia];
  const prevBest = x.attempts ? x.best : null;
  const prevTime = x.bestTime;
  x.attempts++; st.total++; st.sumPct += pct;
  const nuevoRecord = pct>x.best;
  if(nuevoRecord) x.best = pct;
  if(sin===0 && (x.bestTime===null || tiempo<x.bestTime)) x.bestTime = tiempo;
  x.history.push({n:x.attempts, p:pct, t:tiempo, d:Date.now(), m:S.modo});
  x.history = x.history.slice(-20);
  lsSet(KEYS.stats, st);

  R = {
    materia:S.materia, modo:S.modo, preguntas:S.preguntas, resp:S.resp, marks:S.marks,
    ok, mal, sin, pct, tiempo, nuevoRecord, prevBest, prevTime,
    best:x.best, bestTime:x.bestTime, attempts:x.attempts, history:x.history.slice(-8)
  };
  S = null; lsDel(KEYS.session);
  view = 'results'; filtro = 'todas';
  render('#resTitle');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------------- Gráficos Canvas ---------------- */
function setupCanvas(c){
  const dpr = window.devicePixelRatio||1, r = c.getBoundingClientRect();
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  return {g, w:r.width, h:r.height};
}
function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h);
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h); g.lineTo(x,y+h); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function drawCharts(){
  if(view!=='results' || !R) return;
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();

  const c1 = $('#cDonut');
  if(c1){
    const {g,w,h} = setupCanvas(c1);
    const parts = [{v:R.ok,c:v('--ok')},{v:R.mal,c:v('--bad')},{v:R.sin,c:'#94a3b8'}];
    const total = parts.reduce((a,p)=>a+p.v,0);
    const cx=w/2, cy=h/2, Ro=Math.min(w,h)/2-8, Ri=Ro*0.62;
    g.clearRect(0,0,w,h);
    if(!total){
      g.beginPath(); g.arc(cx,cy,Ro,0,2*Math.PI); g.arc(cx,cy,Ri,2*Math.PI,0,true); g.fillStyle=v('--pend'); g.fill();
    }else{
      let a = -Math.PI/2;
      parts.forEach(p=>{
        if(!p.v) return;
        const ang = p.v/total*2*Math.PI;
        g.beginPath(); g.arc(cx,cy,Ro,a,a+ang); g.arc(cx,cy,Ri,a+ang,a,true); g.closePath();
        g.fillStyle=p.c; g.fill(); a += ang;
      });
    }
    g.fillStyle = v('--text'); g.textAlign='center'; g.textBaseline='middle';
    g.font = '700 28px "Segoe UI",system-ui,sans-serif'; g.fillText(R.pct+'%', cx, cy-6);
    g.fillStyle = v('--muted'); g.font = '13px "Segoe UI",system-ui,sans-serif'; g.fillText('acierto', cx, cy+18);
  }

  const c2 = $('#cBars');
  if(c2){
    const {g,w,h} = setupCanvas(c2);
    g.clearRect(0,0,w,h);
    const hist = R.history, pl=34, pr=8, pt=18, pb=28;
    const iw = w-pl-pr, ih = h-pt-pb;
    g.font = '12px "Segoe UI",system-ui,sans-serif'; g.textBaseline='middle';
    [0,50,100].forEach(val=>{
      const y = pt + ih - ih*val/100;
      g.strokeStyle = v('--border'); g.lineWidth=1; g.beginPath(); g.moveTo(pl,y); g.lineTo(w-pr,y); g.stroke();
      g.fillStyle = v('--muted'); g.textAlign='right'; g.fillText(val+'%', pl-6, y);
    });
    const slot = iw/Math.max(hist.length,1), bw = Math.min(46, slot*0.6);
    hist.forEach((it,k)=>{
      const x = pl + slot*k + (slot-bw)/2, bh = ih*it.p/100, y = pt+ih-bh;
      const last = k===hist.length-1;
      g.fillStyle = last ? v('--primary-2') : v('--muted'); g.globalAlpha = last?1:.45;
      rr(g,x,y,bw,Math.max(bh,2),6); g.fill(); g.globalAlpha=1;
      g.fillStyle = v('--text'); g.textAlign='center'; g.textBaseline='bottom';
      g.fillText(it.p+'%', x+bw/2, y-3);
      g.fillStyle = v('--muted'); g.textBaseline='top';
      g.fillText('#'+it.n, x+bw/2, pt+ih+7);
    });
  }
}

window.addEventListener('resize', ()=>{ clearTimeout(rsT); rsT = setTimeout(drawCharts,120); });

  if(a==='opt') elegir(+b.dataset.i);

  else if(a==='prev'){ const p = anterior(); if(p!==undefined) irA(p); }

});

/* Atajos de teclado */
document.addEventListener('keydown', e=>{
  if(modalOpen() || view!=='exam' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea') return;
  const q = S.preguntas[S.idx];
  if(/^[1-9]$/.test(e.key)){ const i = +e.key-1; if(i<q.opciones.length){ e.preventDefault(); elegir(i); } }
  else if(e.key==='ArrowRight'){ const n = siguiente(); if(n!==undefined){ e.preventDefault(); irA(n); } }
  else if(e.key==='ArrowLeft'){ const p = anterior(); if(p!==undefined){ e.preventDefault(); irA(p); } }

});

/* Tema */
function aplicarTema(t, guardar){
  document.documentElement.setAttribute('data-theme', t);
  const b = $('#themeBtn');
  b.textContent = t==='dark' ? '☀️' : '🌙';
  b.setAttribute('aria-label', t==='dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
  if(guardar) try{ localStorage.setItem(KEYS.theme, t); }catch(e){}
  drawCharts();
}
$('#themeBtn').addEventListener('click', ()=>{
  aplicarTema(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark', true);
});

/* Guardar al cerrar / ocultar la página */
window.addEventListener('beforeunload', saveSession);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveSession(); });

/* Escudo: si no hay conexión, usar uno incrustado */
$('#logo').addEventListener('error', function(){
  this.onerror = null;
  this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 4 8 12v18c0 15 10 26 24 30 14-4 24-15 24-30V12z" fill="#0f4c81"/><path d="M32 12 16 18v12c0 10 7 18 16 21 9-3 16-11 16-21V18z" fill="#fff"/><path d="M32 20l3.5 7.5 8 1-6 5.5 1.7 8L32 38l-7.2 4 1.7-8-6-5.5 8-1z" fill="#0f4c81"/></svg>');
});

/* ---------------- Arranque ---------------- */
async function init(){
  aplicarTema(document.documentElement.getAttribute('data-theme')||'light', false);

  resetTimer();
  await detectarMaterias();
  // Solo restaura importaciones manuales cuando no hay bancos públicos.
  const guardado=lsGet(KEYS.bank,null);
  if(!MATERIAS.some(m=>m.ruta) && guardado && guardado.v===2 && Array.isArray(guardado.materias)){
    guardado.materias.forEach(m=>{
      if(!m.key || !m.nombre || !Array.isArray(m.preguntas) || !m.preguntas.length) return;
      MATERIAS=MATERIAS.filter(x=>x.key!==m.key);
      MATERIAS.push({key:m.key,nombre:m.nombre,icono:m.icono||''});
      bancosPreguntas[m.key]=m.preguntas;cacheMaterias.set(m.key,m.preguntas);
    });
    bankSource='Importación manual guardada';render();
  }

  const s = lsGet(KEYS.session, null);
  if(sesionValida(s)){
    const r = await ask('Se encontró una sesión anterior.',
      `${materiaNombre(s.materia)} · ${s.modo==='practica'?'Práctica':'Simulacro'} · pregunta ${Math.min(s.idx+1,s.preguntas.length)} de ${s.preguntas.length} · tiempo ${fmt(s.tiempo)}.`,
      [{label:'Reiniciar examen', value:'restart'},{label:'Continuar examen', value:'continue', primary:true}]);
    if(r==='continue'){
      uiMode = s.modo; filtro = s.filtro || 'todas';
      S = {materia:s.materia, modo:s.modo, preguntas:s.preguntas,
           idx:Math.max(0,Math.min(s.idx,s.preguntas.length-1)), resp:s.resp, marks:s.marks};
      view = 'exam';
      startTimer(s.tiempo||0);
      render('#qTitle', true);
    }else{
      uiMode = s.modo;
      await iniciarExamen(s.materia, s.modo);
    }
  }else if(s){ lsDel(KEYS.session); }


}
init();
</script>
