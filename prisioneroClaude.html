<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilema del prisionero (Copy)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecf1;--card:#fbfbfd;--ink:#161a23;--mute:#5b6577;--line:#cdd3de;--c:#0e8a58;--t:#cf3a35;--mix:#b8790a;--on-c:#fff;--on-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1219;--card:#181d27;--ink:#e8ecf3;--mute:#8f9bb0;--line:#2a3242;--c:#3ddc97;--t:#ff6b64;--mix:#f2b84b;--on-c:#07140d;--on-t:#1a0605}}
:root[data-theme="dark"]{--bg:#0f1219;--card:#181d27;--ink:#e8ecf3;--mute:#8f9bb0;--line:#2a3242;--c:#3ddc97;--t:#ff6b64;--mix:#f2b84b;--on-c:#07140d;--on-t:#1a0605}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.025em;margin:0}
h3{margin:0 0 10px;font-size:1.05rem}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#status{margin:16px 0 8px;padding:12px 16px;background:var(--card);border-left:5px solid var(--ink);border-radius:10px;font-weight:600;min-height:48px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
#board{display:grid;grid-template-columns:1fr 270px 1fr;gap:16px;margin-top:16px}
@media(max-width:860px){#board{grid-template-columns:1fr}#center{order:3}}
.panel{--edge:var(--line);background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .3s}
.panel[data-m=C]{--edge:var(--c)}.panel[data-m=T]{--edge:var(--t)}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.15rem}
.ready{font-size:.85rem;font-weight:600;color:var(--mute)}
.sw{position:relative}
.score{font-size:clamp(3.6rem,9vw,5.6rem);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gain{position:absolute;left:0;top:0;font-weight:800;font-size:1.4rem;opacity:0;pointer-events:none}
.gain.rise{animation:rise 1s ease-out}
.lamp{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mute)}
.lamp b{width:14px;height:14px;border-radius:50%;background:var(--line)}
.lamp.c b{background:var(--c)}.lamp.t b{background:var(--t)}
.lamp.c,.lamp.t{color:var(--ink)}
select,input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select:disabled{opacity:.6}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mv{font-weight:800;border:0;border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.mv.c{background:var(--c);color:var(--on-c)}.mv.t{background:var(--t);color:var(--on-t)}
.mv kbd{font:inherit;font-size:.75rem;font-weight:600;border:1px solid currentColor;border-radius:5px;padding:1px 7px;opacity:.85}
.mv:hover:not(:disabled){transform:translateY(-2px)}
.mv:disabled{opacity:.35;cursor:not-allowed}
.hit{animation:hit .35s ease-out}
#center{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px}
table{width:100%;border-collapse:separate;border-spacing:4px;font-size:.8rem}
th{font-weight:600;color:var(--mute);padding:2px;line-height:1.2}
td{text-align:center;padding:12px 2px;border-radius:10px;background:var(--bg);font-weight:800;font-size:1rem;transition:background .3s}
td.on[data-k=cc]{background:color-mix(in srgb,var(--c) 40%,var(--card))}
td.on[data-k=tt]{background:color-mix(in srgb,var(--t) 40%,var(--card))}
td.on[data-k=mix]{background:color-mix(in srgb,var(--mix) 45%,var(--card))}
.dg{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.dg.c{background:var(--c)}.dg.t{background:var(--t)}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
.btn{border:0;border-radius:12px;padding:13px;font-weight:800;background:var(--ink);color:var(--bg)}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:8px 0;border-bottom:1px dashed var(--line)}
.row span:first-child{font-weight:800;min-width:30px}
.dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.dot.c{background:var(--c)}.dot.t{background:var(--t)}
#sum{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#sum li{background:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
.empty{color:var(--mute)}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}20%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
@keyframes hit{from{transform:scale(1.03)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>Dilema del prisionero</h1>
  <div class="tools">
    <button id="mute" class="ghost">🔊 Sonido</button>
    <button id="theme" class="ghost">Cambiar tema</button>
  </div>
</header>

<div id="status" role="status">Elige las estrategias y pulsa Iniciar.</div>
<div class="prog"><i id="bar"></i></div>

<section id="board">
  <div class="panel" id="p1"></div>
  <div id="center">
    <div class="card">
      <table aria-label="Matriz de pagos">
        <tr><th></th><th><i class="dg c"></i>J2 coopera</th><th><i class="dg t"></i>J2 traiciona</th></tr>
        <tr><th><i class="dg c"></i>J1 coopera</th><td id="m-CC" data-k="cc">3 · 3</td><td id="m-CT" data-k="mix">0 · 5</td></tr>
        <tr><th><i class="dg t"></i>J1 traiciona</th><td id="m-TC" data-k="mix">5 · 0</td><td id="m-TT" data-k="tt">1 · 1</td></tr>
      </table>
    </div>
    <div class="card">
      <label for="max">Rondas</label>
      <input type="number" id="max" value="10" min="5" max="100">
      <label for="delay" style="margin-top:10px">Velocidad entre máquinas</label>
      <select id="delay">
        <option value="2000">Lenta (2 s)</option>
        <option value="1000" selected>Normal (1 s)</option>
        <option value="500">Rápida (0,5 s)</option>
        <option value="200">Muy rápida (0,2 s)</option>
        <option value="50">Ultra rápida (sin sonido)</option>
      </select>
    </div>
    <button class="btn" id="start">Iniciar juego</button>
    <button class="btn sec" id="pause" hidden>Pausar</button>
    <button class="btn sec" id="reset">Reiniciar</button>
  </div>
  <div class="panel" id="p2"></div>
</section>

<section class="card" style="margin-top:16px">
  <h3>Historial de jugadas</h3>
  <div class="row" id="h1"><span>J1</span></div>
  <div class="row" id="h2"><span>J2</span></div>
</section>

<section class="card" style="margin-top:16px">
  <h3>Partidas terminadas</h3>
  <ul id="sum"><li class="empty">Aún no has terminado ninguna partida.</li></ul>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const PAY={CC:[3,3],CT:[0,5],TC:[5,0],TT:[1,1]};
const STRATS=[['Human','🧑 Humano'],['TitForTat','🔄 Tit-for-Tat'],['TitForTwoTats','🔄🔄 Tit-for-Two-Tats'],['GrimTrigger','⚡ Gatillo siniestro'],['Pavlov','🧠 Pavlov'],['Majority','📊 Mayoría'],['AlwaysCooperate','😇 Siempre coopera'],['AlwaysBetray','😈 Siempre traiciona'],['Random','🎲 Aleatoria 50/50'],['Random70','🎲 Aleatoria 70/30'],['Random30','🎲 Aleatoria 30/70']];
let round=0,max=10,scores=[0,0],log=[],active=false,paused=false,loop=null,pending={},busy=false,token=0,muted=false,ac=null;

/* ---------- Sonido (sintetizado, sin archivos) ---------- */
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
function tone(f,t0,d,type,v,f2){
  const a=audio();if(!a||muted)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const SND={
  // dos verdes: acorde mayor ascendente, cálido
  CC:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.08,.55,'triangle',.13)),
  // dos rojas: zumbido grave y disonante
  TT:()=>{tone(110,0,.6,'sawtooth',.09);tone(116.5,0,.6,'sawtooth',.09);tone(55,0,.6,'square',.07)},
  // una y una: golpe agudo y caída tensa
  MIX:()=>{tone(988,0,.1,'square',.06);tone(520,.1,.5,'sawtooth',.09,240);tone(392,.1,.4,'triangle',.08)},
  tick:()=>tone(620,0,.07,'sine',.08),
  win:()=>[392,494,587,784].forEach((f,i)=>tone(f,i*.11,.5,'triangle',.12)),
  tie:()=>{tone(440,0,.4,'triangle',.1);tone(440,.18,.5,'triangle',.1)}
};

/* ---------- Interfaz ---------- */
const keys={A:'D',J:'L'};
const panel=n=>`<div class="ph"><span>Jugador ${n}</span><span class="ready" id="rd${n}" hidden>✓ ya eligió</span></div>
<div class="sw"><div class="score" id="sc${n}">000</div><span class="gain" id="gn${n}"></span></div>
<div class="lamp" id="lp${n}"><b></b><span>Sin jugadas todavía</span></div>
<select id="st${n}" aria-label="Estrategia del jugador ${n}">${STRATS.map(([v,l])=>`<option value="${v}"${v===(n==1?'Human':'TitForTat')?' selected':''}>${l}</option>`).join('')}</select>
<div class="moves" id="mv${n}"><button class="mv c" id="c${n}">Cooperar<kbd>${n==1?'A':'J'}</kbd></button><button class="mv t" id="t${n}">Traicionar<kbd>${n==1?'D':'L'}</kbd></button></div>`;
$('p1').innerHTML=panel(1);$('p2').innerHTML=panel(2);

const setStatus=s=>$('status').textContent=s;
const pad=n=>String(n).padStart(3,'0');
const pop=(el,cls)=>{el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};
const isHuman=n=>$('st'+n).value==='Human';
const label=n=>$('st'+n).selectedOptions[0].textContent.replace(/^[^\p{L}]+/u,'');

function sync(){
  [1,2].forEach(n=>{
    $('mv'+n).hidden=!isHuman(n);
    $('c'+n).disabled=$('t'+n).disabled=!(active&&!busy);
    $('st'+n).disabled=active;
  });
  $('max').disabled=active;
  $('pause').hidden=!(active&&!isHuman(1)&&!isHuman(2));
}

function fresh(){
  token++;clearTimeout(loop);loop=null;
  pending={};busy=false;round=0;scores=[0,0];log=[];paused=false;
  [1,2].forEach(n=>{
    $('sc'+n).textContent='000';$('gn'+n).textContent='';$('rd'+n).hidden=true;
    $('p'+n).removeAttribute('data-m');
    $('lp'+n).className='lamp';$('lp'+n).lastChild.textContent='Sin jugadas todavía';
    $('h'+n).innerHTML=`<span>J${n}</span>`;
  });
  document.querySelectorAll('td').forEach(td=>td.classList.remove('on'));
  $('bar').style.width='0';$('pause').textContent='Pausar';
}

function startGame(){
  audio();
  fresh();
  max=Math.min(100,Math.max(5,parseInt($('max').value)||10));$('max').value=max;
  active=true;sync();
  if(!isHuman(1)&&!isHuman(2)){setStatus('Las máquinas están jugando…');runMachines()}
  else if(isHuman(1)&&isHuman(2))setStatus('Elijan en secreto: cada uno con sus teclas.');
  else setStatus('Tu turno: elige cooperar o traicionar.');
}
function resetGame(){fresh();active=false;sync();setStatus('Partida reiniciada. Pulsa Iniciar.')}
function pauseGame(){
  paused=!paused;
  $('pause').textContent=paused?'Reanudar':'Pausar';
  if(paused){clearTimeout(loop);loop=null;setStatus('Partida en pausa.')}
  else{setStatus('Las máquinas están jugando…');runMachines()}
}

/* ---------- Lógica ---------- */
function runMachines(){
  if(!active||paused)return;
  if(round>=max){endGame();return}
  processMoves(machine(1),machine(2));
  if(round<max)loop=setTimeout(runMachines,parseInt($('delay').value));
}

function play(p,m){
  if(!active||busy||round>=max)return;
  if(isHuman(1)&&isHuman(2)){
    pending[p]=m;$('rd'+p).hidden=false;SND.tick();
    if(pending[1]&&pending[2]){
      busy=true;sync();setStatus('Revelando jugadas…');
      const tk=token,a=pending[1],b=pending[2];
      setTimeout(()=>{
        if(tk!==token)return;
        pending={};busy=false;[1,2].forEach(n=>$('rd'+n).hidden=true);
        processMoves(a,b);sync();
      },900);
    }else setStatus(`El jugador ${p} ya eligió. Falta el jugador ${p==1?2:1}.`);
    return;
  }
  SND.tick();
  if(p===1&&isHuman(1))processMoves(m,machine(2));
  else if(p===2&&isHuman(2))processMoves(machine(1),m);
}

function processMoves(a,b){
  const [x,y]=PAY[a+b],kind=a===b?a+b:'MIX';
  scores[0]+=x;scores[1]+=y;
  log.push({p1:a,p2:b,s1:x,s2:y});round++;
  const names={C:'cooperó',T:'traicionó'};
  [[1,a,x],[2,b,y]].forEach(([n,m,g])=>{
    $('sc'+n).textContent=pad(scores[n-1]);
    const P=$('p'+n);P.dataset.m=m;pop(P,'hit');
    $('lp'+n).className='lamp '+(m==='C'?'c':'t');
    $('lp'+n).lastChild.textContent=m==='C'?'Cooperó':'Traicionó';
    const gn=$('gn'+n);gn.textContent='+'+g;pop(gn,'rise');
    const d=document.createElement('span');
    d.className='dot '+(m==='C'?'c':'t');d.title=`Ronda ${round}: ${names[m]}`;
    $('h'+n).appendChild(d);
  });
  document.querySelectorAll('td').forEach(td=>td.classList.remove('on'));
  $('m-'+a+b).classList.add('on');
  const machinesOnly=!isHuman(1)&&!isHuman(2);
  if(!(machinesOnly&&parseInt($('delay').value)<200))SND[kind]();
  $('bar').style.width=(round/max*100)+'%';
  setStatus(`Ronda ${round} de ${max}: J1 ${names[a]} (+${x}), J2 ${names[b]} (+${y})`);
  if(round>=max){const tk=token;setTimeout(()=>{if(tk===token)endGame()},700)}
}

function endGame(){
  if(!active)return;
  active=false;paused=false;clearTimeout(loop);loop=null;
  const [s1,s2]=scores;
  const w=s1>s2?'ganó el jugador 1':s2>s1?'ganó el jugador 2':'empate';
  setStatus(`Fin de la partida: ${w} (${s1} a ${s2}).`);
  (s1===s2?SND.tie:SND.win)();
  const sum=$('sum');
  if(sum.firstChild&&sum.firstChild.className==='empty')sum.innerHTML='';
  const li=document.createElement('li');
  li.textContent=`${label(1)} vs ${label(2)}: ${s1} a ${s2}, ${w}`;
  sum.prepend(li);
  sync();
}

function machine(n){
  const o=n===1?2:1,key=k=>log.map(r=>r[k]);
  const opp=key('p'+o),me=key('p'+n),mine=key('s'+n);
  switch($('st'+n).value){
    case 'AlwaysCooperate':return 'C';
    case 'AlwaysBetray':return 'T';
    case 'Random':return Math.random()<.5?'C':'T';
    case 'Random70':return Math.random()<.7?'C':'T';
    case 'Random30':return Math.random()<.3?'C':'T';
    case 'TitForTat':return log.length?opp[opp.length-1]:'C';
    case 'GrimTrigger':return opp.includes('T')?'T':'C';
    case 'TitForTwoTats':return opp.slice(-2).length===2&&opp.slice(-2).every(m=>m==='T')?'T':'C';
    case 'Pavlov':{
      if(!log.length)return 'C';
      const last=me[me.length-1];
      return mine[mine.length-1]>=3?last:(last==='C'?'T':'C');
    }
    case 'Majority':{
      const t=opp.filter(m=>m==='T').length;
      return opp.length-t>=t?'C':'T';
    }
    default:return 'C';
  }
}

/* ---------- Eventos ---------- */
$('start').onclick=startGame;$('pause').onclick=pauseGame;$('reset').onclick=resetGame;
['st1','st2'].forEach(id=>$(id).onchange=sync);
$('c1').onclick=()=>play(1,'C');$('t1').onclick=()=>play(1,'T');
$('c2').onclick=()=>play(2,'C');$('t2').onclick=()=>play(2,'T');
const KEYS={a:[1,'C'],d:[1,'T'],j:[2,'C'],l:[2,'T']};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey)return;
  const k=KEYS[e.key.toLowerCase()];
  if(k&&isHuman(k[0])&&active&&!busy){play(k[0],k[1]);e.preventDefault()}
});

function paintMute(){$('mute').textContent=muted?'🔇 Silencio':'🔊 Sonido'}
try{muted=localStorage.getItem('pd-muted')==='1'}catch(e){}
paintMute();
$('mute').onclick=()=>{muted=!muted;paintMute();try{localStorage.setItem('pd-muted',muted?'1':'0')}catch(e){}if(!muted){audio();SND.tick()}};

try{const th=localStorage.getItem('pd-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('theme').onclick=()=>{
  const r=document.documentElement;
  const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=cur==='dark'?'light':'dark';
  try{localStorage.setItem('pd-theme',r.dataset.theme)}catch(e){}
};
sync();
</script>
</body>
</html>
