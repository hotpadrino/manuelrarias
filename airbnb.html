<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asistencia Institucional</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Librerías Externas -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <style>
        /* ==========================================
           ESTILOS GENERALES
        ========================================== */
        body { background-color: #f4f6f9; }
        
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        #firma-pad {
            touch-action: none; 
            border: 2px dashed #adb5bd !important;
            cursor: crosshair;
        }
        
        .firma-img {
            max-height: 45px;
            display: block;
            margin: 0 auto;
        }

        /* ==========================================
           REGLAS DE IMPRESIÓN
        ========================================== */
        @media print {
            body { background-color: #fff; margin: 0; }
            .no-print, #auth-section, #hub-section, header { display: none !important; }
            #documento-impresion { border: none !important; box-shadow: none !important; width: 100%; margin: 0; padding: 0; }
            .table { width: 100% !important; font-size: 10pt; }
            .table th { background-color: #e9ecef !important; -webkit-print-color-adjust: exact; color-adjust: exact; }
            .col-acciones, .btn-eliminar { display: none !important; }
            @page { margin: 1cm; size: landscape; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         1. PANEL PRINCIPAL (HUB PÚBLICO)
    =========================================== -->
    <div id="hub-section" class="container mt-5">
        <div class="card mx-auto shadow border-0" style="max-width: 500px;">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="m-0 fw-bold">Sistema de Asistencia</h4>
            </div>
            <div class="card-body p-4">
                <div class="row mb-4">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label fw-bold">Fecha del Evento</label>
                        <input type="date" id="hub-fecha" class="form-control form-control-lg">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Código de Control</label>
                        <input type="text" id="hub-codigo" class="form-control form-control-lg text-center" maxlength="4" placeholder="Ej: 5847">
                    </div>
                </div>
                
                <div class="d-grid gap-3">
                    <button id="btn-ir-registrar" class="btn btn-info text-white btn-lg fw-bold shadow-sm" onclick="irARegistrar()">
                        1. Registrar Mi Asistencia
                    </button>
                    <hr class="my-2 text-muted">
                    <button class="btn btn-outline-success fw-bold" onclick="irACrear()">
                        2. Crear Nueva Asistencia (Admin)
                    </button>
                    <button class="btn btn-outline-secondary fw-bold" onclick="irAConsultar()">
                        3. Consultar / Exportar (Admin)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         2. MÓDULO DE AUTENTICACIÓN
    =========================================== -->
    <div id="auth-section" class="container mt-5 d-none">
        <div class="card mx-auto shadow-sm" style="max-width: 450px;">
            <div class="card-body">
                <button class="btn btn-sm btn-light text-muted mb-3 border" onclick="volverAlHub()">← Volver al inicio</button>
                <h4 class="card-title text-center mb-4 fw-bold">Acceso Institucional</h4>
                
                <ul class="nav nav-tabs mb-3" id="authTabs">
                    <li class="nav-item"><a class="nav-link active" href="#" id="tab-login" onclick="toggleAuth('login')">Ingresar</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="tab-register" onclick="toggleAuth('register')">Nuevo Administrador</a></li>
                </ul>

                <form id="login-form">
                    <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="login-email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" id="login-password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                    <div class="mt-3 text-center"><a href="#" onclick="recuperarPassword(event)">¿Olvidó su contraseña?</a></div>
                </form>

                <form id="register-form" class="d-none">
                    <div class="mb-3"><label class="form-label">Grado, Nombres y Apellidos</label><input type="text" id="reg-nombre" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="reg-email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" id="reg-password" class="form-control" required minlength="6"></div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">Crear Cuenta</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==========================================
         3. MÓDULO PRINCIPAL DE LA APLICACIÓN
    =========================================== -->
    <div id="main-section" class="container mt-4 d-none">
        
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 no-print border-bottom pb-3">
            <h2 class="m-0 text-dark fw-bold mb-3 mb-md-0">Gestión de Evento</h2>
            <div class="d-flex align-items-center">
                <span id="user-display-name" class="me-3 fw-bold text-secondary"></span>
                <button class="btn btn-outline-secondary btn-sm me-2" onclick="volverAlHub()">Inicio</button>
                <button id="btn-logout" class="btn btn-danger btn-sm admin-only d-none">Cerrar Sesión</button>
            </div>
        </header>

        <!-- VISTA: CREAR REUNIÓN -->
        <div id="crear-reunion" class="view-section">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white fw-bold">Nueva Asistencia Institucional</div>
                <div class="card-body">
                    <div class="alert alert-success d-none text-center fs-5" id="codigo-generado-alert"></div>
                    <form id="form-reunion">
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">Fecha</label><input type="date" id="r-fecha" class="form-control" required></div>
                            <div class="col-md-8 mb-3"><label class="form-label">Tema</label><input type="text" id="r-tema" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Oficina Productora</label><input type="text" id="r-oficina" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Lugar</label><input type="text" id="r-lugar" class="form-control" required></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Hora Inicio</label><input type="time" id="r-inicio" class="form-control" required></div>
                            <div class="col-md-3 mb-3"><label class="form-label">Hora Fin</label><input type="time" id="r-fin" class="form-control" required></div>
                            <div class="col-md-12 mb-3"><label class="form-label">Observaciones</label><textarea id="r-obs" class="form-control" rows="2"></textarea></div>
                        </div>
                        <button id="btn-guardar-reunion" type="submit" class="btn btn-success btn-lg mt-2 fw-bold">Guardar y Generar Código</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- VISTA: REPORTAR ASISTENTE -->
        <div id="reportar-asistente" class="view-section">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-info text-white fw-bold">Registro de Asistente</div>
                <div class="card-body">
                    <form id="form-asistente">
                        <div class="row mb-4 bg-light p-3 rounded border">
                            <div class="col-md-6 mb-2 mb-md-0"><label class="form-label">Fecha del Evento</label><input type="date" id="a-fecha" class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Código de Control</label><input type="text" id="a-codigo" class="form-control text-center fw-bold" maxlength="4" required></div>
                        </div>
                        <div class="row">
                            <div class="col-md-2 mb-3"><label class="form-label">Grado</label><input type="text" id="a-grado" class="form-control" ></div>
                            <div class="col-md-10 mb-3"><label class="form-label">Nombres y Apellidos</label><input type="text" id="a-nombres" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Cargo</label><input type="text" id="a-cargo" class="form-control" ></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Dependencia</label><input type="text" id="a-dep" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Teléfono</label><input type="tel" id="a-tel" class="form-control"></div>
                            <div class="col-md-6 mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="a-correo" class="form-control"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Firma Digital (Diligencie dentro del recuadro)</label>
                            <canvas id="firma-pad" class="border rounded d-block bg-white w-100" height="200"></canvas>
                            <div class="mt-2 text-end">
                                <button type="button" class="btn btn-sm btn-outline-warning" onclick="limpiarFirma()">Borrar Firma</button>
                            </div>
                        </div>
                        <button id="btn-guardar-asistente" type="submit" class="btn btn-info text-white btn-lg w-100 fw-bold">Guardar Asistencia</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- VISTA: VISUALIZAR Y EXPORTAR -->
        <div id="ver-asistencia" class="view-section">
            <div class="row mb-4 no-print align-items-end bg-white p-3 rounded shadow-sm border">
                <div class="col-md-4 mb-2 mb-md-0"><label class="form-label">Fecha de la Reunión</label><input type="date" id="v-fecha" class="form-control"></div>
                <div class="col-md-4 mb-2 mb-md-0"><label class="form-label">Código de Control</label><input type="text" id="v-codigo" class="form-control text-center fw-bold" maxlength="4"></div>
                <div class="col-md-4"><button id="btn-buscar" class="btn btn-secondary w-100 fw-bold" onclick="buscarAsistencia()">Buscar Lista</button></div>
            </div>
            
            <div class="mb-3 no-print text-end d-none" id="export-buttons">
                <button class="btn btn-danger me-1 fw-bold" onclick="exportarPDF()">PDF</button>
                <button class="btn btn-success me-1 fw-bold" onclick="exportarExcel()">Excel</button>
                <button class="btn btn-dark fw-bold" onclick="window.print()">Imprimir</button>
            </div>

            <div id="documento-impresion" class="bg-white p-4 shadow-sm rounded border d-none">
                <div id="reporte-content"></div>
            </div>
        </div>
    </div>

    <!-- ==========================================
         LÓGICA JAVASCRIPT
    =========================================== -->
    <script>
        // ------------------------------------------
        // 0. CONFIGURACIÓN FECHA POR DEFECTO
        // ------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            // Obtenemos la fecha actual ajustada a la zona horaria local del navegador
            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            const hoy = (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
            
            document.getElementById('hub-fecha').value = hoy;
            document.getElementById('r-fecha').value = hoy;
            document.getElementById('a-fecha').value = hoy;
            document.getElementById('v-fecha').value = hoy;
        });

        // ------------------------------------------
        // 1. INICIALIZACIÓN SUPABASE (CORREGIDO)
        // ------------------------------------------
        const supabaseUrl = 'https://yfbfbywjwslxsrgamqhj.supabase.co'; 
        const supabaseKey = 'sb_publishable_PXth9Sd24jgQOizXrmk5Tw_YVJh4V6j'; 
        // Cambiamos el nombre de la variable para evitar colisión con el CDN global
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
            db: { schema: 'asistencia' }
        });

        let sessionActiva = null;
        let destinoPendiente = null;
        let currentReunion = null;
        let currentAsistentes = [];

        // ------------------------------------------
        // 2. ENRUTAMIENTO Y ESTADO DE SESIÓN
        // ------------------------------------------
        supabaseClient.auth.onAuthStateChange((event, session) => {
            sessionActiva = session;
            if (session) {
                const name = session.user.user_metadata.display_name || session.user.email;
                document.getElementById('user-display-name').textContent = 'Admin: ' + name;
                document.getElementById('btn-logout').classList.remove('d-none');
                
                if (destinoPendiente) {
                    mostrarPanelApp(destinoPendiente);
                    destinoPendiente = null;
                }
            } else {
                document.getElementById('user-display-name').textContent = '';
                document.getElementById('btn-logout').classList.add('d-none');
            }
        });

        function volverAlHub() {
            document.getElementById('main-section').classList.add('d-none');
            document.getElementById('auth-section').classList.add('d-none');
            document.getElementById('hub-section').classList.remove('d-none');
            destinoPendiente = null;
        }

        function mostrarPanelApp(viewId) {
            document.getElementById('hub-section').classList.add('d-none');
            document.getElementById('auth-section').classList.add('d-none');
            document.getElementById('main-section').classList.remove('d-none');
            
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function requerirLoginPara(viewId) {
            if (sessionActiva) mostrarPanelApp(viewId);
            else {
                destinoPendiente = viewId;
                document.getElementById('hub-section').classList.add('d-none');
                document.getElementById('auth-section').classList.remove('d-none');
            }
        }

        // ACCIONES DEL HUB
        async function irARegistrar() {
            const fecha = document.getElementById('hub-fecha').value;
            const codigo = document.getElementById('hub-codigo').value;
            
            if (!fecha || !codigo) {
                alert('Ingrese la fecha y el código de control para registrar su asistencia.');
                return;
            }
            
            // Simular carga y deshabilitar botón
            const btn = document.getElementById('btn-ir-registrar');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verificando Evento...';
            btn.disabled = true;

            // VALIDACIÓN: Consultar a la base de datos si el evento existe
            const { data: reunionId, error: errReunion } = await supabaseClient.rpc('obtener_id_reunion', { p_fecha: fecha, p_codigo: codigo });
            
            // Restaurar el botón
            btn.innerHTML = txtOriginal;
            btn.disabled = false;

            // Si la base de datos retorna error o un ID nulo, detenemos al usuario
            if (!reunionId || errReunion) {
                alert('⚠️ No se encontró ninguna asistencia con esa fecha y código. Por favor verifique con el organizador.');
                return;
            }

            // Si existe, prellenamos el formulario real y lo mostramos
            document.getElementById('a-fecha').value = fecha;
            document.getElementById('a-codigo').value = codigo;
            document.getElementById('a-fecha').readOnly = true;
            document.getElementById('a-codigo').readOnly = true;
            
            mostrarPanelApp('reportar-asistente');
            
            // Reajustar tamaño interno del canvas al mostrarlo
            setTimeout(ajustarCanvas, 100); 
        }

        function irACrear() { requerirLoginPara('crear-reunion'); }
        function irAConsultar() {
            const fecha = document.getElementById('hub-fecha').value;
            const codigo = document.getElementById('hub-codigo').value;
            if(fecha) document.getElementById('v-fecha').value = fecha;
            if(codigo) document.getElementById('v-codigo').value = codigo;
            requerirLoginPara('ver-asistencia');
        }

        function toggleAuth(type) {
            if (type === 'login') {
                document.getElementById('login-form').classList.remove('d-none');
                document.getElementById('register-form').classList.add('d-none');
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
            } else {
                document.getElementById('login-form').classList.add('d-none');
                document.getElementById('register-form').classList.remove('d-none');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('tab-register').classList.add('active');
            }
        }

        // ------------------------------------------
        // 3. AUTENTICACIÓN
        // ------------------------------------------
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Ingresando...';
            btn.disabled = true;

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            btn.innerHTML = 'Iniciar Sesión';
            btn.disabled = false;
            
            if (error) alert('Error al iniciar sesión: ' + error.message);
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Registrando...';
            btn.disabled = true;

            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const name = document.getElementById('reg-nombre').value;
            
            const { error } = await supabaseClient.auth.signUp({
                email, password, options: { data: { display_name: name, schema_origen: 'asistencia' } }
            });
            
            btn.innerHTML = 'Crear Cuenta';
            btn.disabled = false;

            if (error) alert('Error de registro: ' + error.message);
            else alert('Cuenta creada exitosamente. Ya puede iniciar sesión.');
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            volverAlHub();
        });

        async function recuperarPassword(e) {
            if (e) e.preventDefault();
            const email = document.getElementById('login-email').value;
            if (!email) return alert('Ingrese su correo en el campo de acceso antes de solicitar la recuperación.');
            
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
            if (error) alert('Error: ' + error.message);
            else alert('Se ha enviado un enlace de recuperación a su correo.');
        }

        // ------------------------------------------
        // 4. CREAR REUNIÓN
        // ------------------------------------------
        async function generarCodigoUnico(fecha) {
            let codigo, existe = true;
            while(existe) {
                codigo = Math.floor(1000 + Math.random() * 9000).toString();
                const { data } = await supabaseClient.from('reunion').select('id').eq('fecha', fecha).eq('numero_control', codigo);
                if (!data || data.length === 0) existe = false;
            }
            return codigo;
        }

        document.getElementById('form-reunion').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar-reunion');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';
            btn.disabled = true;

            const fecha = document.getElementById('r-fecha').value;
            const codigo = await generarCodigoUnico(fecha);
            
            const nuevaReunion = {
                fecha: fecha, numero_control: codigo,
                tema: document.getElementById('r-tema').value,
                oficina_productora: document.getElementById('r-oficina').value,
                lugar: document.getElementById('r-lugar').value,
                hora_inicio: document.getElementById('r-inicio').value,
                hora_fin: document.getElementById('r-fin').value,
                observaciones: document.getElementById('r-obs').value
            };

            const { error } = await supabaseClient.from('reunion').insert([nuevaReunion]);
            
            btn.innerHTML = txtOriginal;
            btn.disabled = false;

            if (error) alert('Error al crear reunión: ' + error.message);
            else {
                const alertBox = document.getElementById('codigo-generado-alert');
                alertBox.innerHTML = `Asistencia creada.<br>Fecha: <strong>${fecha}</strong> | Código de control: <strong>${codigo}</strong>`;
                alertBox.classList.remove('d-none');
                document.getElementById('form-reunion').reset();
                document.getElementById('r-fecha').value = fecha; // Restaurar fecha tras el reset
            }
        });

        // ------------------------------------------
        // 5. CANVAS FIRMA DIGITAL
        // ------------------------------------------
        const canvas = document.getElementById('firma-pad');
        const ctx = canvas.getContext('2d');
        let pintando = false;

        function ajustarCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight || 200;
        }
        window.addEventListener('resize', ajustarCanvas);

        function iniciarPosicion(e) { pintando = true; dibujar(e); }
        function finalizarPosicion() { pintando = false; ctx.beginPath(); }
        function dibujar(e) {
            if (!pintando) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = "#000";
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', iniciarPosicion);
        canvas.addEventListener('mouseup', finalizarPosicion);
        canvas.addEventListener('mousemove', dibujar);
        canvas.addEventListener('touchstart', iniciarPosicion, {passive: false});
        canvas.addEventListener('touchend', finalizarPosicion);
        canvas.addEventListener('touchmove', dibujar, {passive: false});

        function limpiarFirma() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // ------------------------------------------
        // 6. REGISTRAR ASISTENTE
        // ------------------------------------------
        document.getElementById('form-asistente').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firmaBase64 = canvas.toDataURL('image/png');
            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            if (firmaBase64 === blank.toDataURL()) return alert('Por favor, firme en el recuadro antes de guardar.');

            const btn = document.getElementById('btn-guardar-asistente');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando Asistencia...';
            btn.disabled = true;

            const fecha = document.getElementById('a-fecha').value;
            const codigo = document.getElementById('a-codigo').value;
            
            const { data: reunionId, error: errReunion } = await supabaseClient.rpc('obtener_id_reunion', { p_fecha: fecha, p_codigo: codigo });
            
            if (!reunionId || errReunion) {
                btn.innerHTML = txtOriginal;
                btn.disabled = false;
                return alert('Reunión no encontrada. Verifique la fecha y el código.');
            }

            const asistente = {
                reunion_id: reunionId,
                grado: document.getElementById('a-grado').value,
                nombre_apellidos: document.getElementById('a-nombres').value,
                cargo: document.getElementById('a-cargo').value,
                dependencia: document.getElementById('a-dep').value,
                telefono: document.getElementById('a-tel').value,
                correo: document.getElementById('a-correo').value,
                firma_base64: firmaBase64
            };

            const { error } = await supabaseClient.from('usuario').insert([asistente]);
            
            btn.innerHTML = txtOriginal;
            btn.disabled = false;

            if (error) alert('Error al guardar el asistente: ' + error.message);
            else {
                alert('Asistente registrado correctamente.');
                document.getElementById('form-asistente').reset();
                limpiarFirma();
                volverAlHub();
            }
        });

        // ------------------------------------------
        // 7. VISUALIZAR Y EXPORTAR
        // ------------------------------------------
        async function buscarAsistencia() {
            const fecha = document.getElementById('v-fecha').value;
            const codigo = document.getElementById('v-codigo').value;
            if (!fecha || !codigo) return alert('Ingrese la fecha y el código.');

            const btn = document.getElementById('btn-buscar');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Buscando...';
            btn.disabled = true;

            const { data: reunion, error: errReunion } = await supabaseClient.from('reunion').select('*').eq('fecha', fecha).eq('numero_control', codigo).single();
            
            if (errReunion || !reunion) {
                btn.innerHTML = txtOriginal;
                btn.disabled = false;
                return alert('Reunión no encontrada.');
            }

            const { data: asistentes, error: errAsistentes } = await supabaseClient.from('usuario').select('*').eq('reunion_id', reunion.id).order('consecutivo', { ascending: true });
            
            btn.innerHTML = txtOriginal;
            btn.disabled = false;

            if (errAsistentes) return alert('Error al cargar asistentes.');

            currentReunion = reunion;
            currentAsistentes = asistentes;
            renderizarReporte();
        }

        function renderizarReporte() {
            const contenedor = document.getElementById('reporte-content');
            document.getElementById('documento-impresion').classList.remove('d-none');
            document.getElementById('export-buttons').classList.remove('d-none');

            let html = `
                <div class="text-center mb-4">
                    <h4 class="fw-bold">LISTADO DE ASISTENCIA INSTITUCIONAL</h4>
                </div>
                <div class="row mb-4" style="font-size: 0.9rem;">
                    <div class="col-6"><strong>Código de Control:</strong> ${currentReunion.numero_control}</div>
                    <div class="col-6"><strong>Fecha:</strong> ${currentReunion.fecha}</div>
                    <div class="col-12"><strong>Tema:</strong> ${currentReunion.tema}</div>
                    <div class="col-6"><strong>Lugar:</strong> ${currentReunion.lugar}</div>
                    <div class="col-6"><strong>Oficina Productora:</strong> ${currentReunion.oficina_productora}</div>
                    <div class="col-6"><strong>Hora Inicio:</strong> ${currentReunion.hora_inicio}</div>
                    <div class="col-6"><strong>Hora Fin:</strong> ${currentReunion.hora_fin}</div>
                    <div class="col-12"><strong>Observaciones:</strong> ${currentReunion.observaciones || 'N/A'}</div>
                    <div class="col-12 mt-2"><strong>Total Asistentes:</strong> ${currentAsistentes.length}</div>
                </div>
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>No.</th><th>Grado</th><th>Nombres y Apellidos</th>
                            <th>Cargo / Dependencia</th><th>Contacto</th><th>Firma</th>
                            <th class="col-acciones text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            currentAsistentes.forEach((a, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${a.grado}</td>
                        <td>${a.nombre_apellidos}</td>
                        <td>${a.cargo}<br><small class="text-muted">${a.dependencia}</small></td>
                        <td>${a.telefono || '-'}<br><small>${a.correo || '-'}</small></td>
                        <td class="text-center"><img src="${a.firma_base64}" class="firma-img" alt="Firma"></td>
                        <td class="col-acciones text-center">
                            <button class="btn btn-danger btn-sm btn-eliminar" onclick="eliminarAsistente('${a.id}')">X</button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            contenedor.innerHTML = html;
        }

        window.eliminarAsistente = async function(id) {
            if (confirm('¿Está seguro de eliminar este asistente?')) {
                const { error } = await supabaseClient.from('usuario').delete().eq('id', id);
                if (error) alert('Error: ' + error.message);
                else buscarAsistencia(); 
            }
        };

        window.exportarPDF = function() {
            const elemento = document.getElementById('documento-impresion');
            const botones = document.querySelectorAll('.col-acciones');
            botones.forEach(btn => btn.style.display = 'none'); 

            html2canvas(elemento, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`Asistencia_${currentReunion.numero_control}.pdf`);
                
                botones.forEach(btn => btn.style.display = ''); 
            });
        };

        window.exportarExcel = async function() {
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Asistencia');
            
            worksheet.columns = [
                { header: 'No.', key: 'no', width: 5 },
                { header: 'Grado', key: 'grado', width: 10 },
                { header: 'Nombres', key: 'nombres', width: 35 },
                { header: 'Cargo', key: 'cargo', width: 25 },
                { header: 'Dependencia', key: 'dependencia', width: 25 },
                { header: 'Teléfono', key: 'tel', width: 15 },
                { header: 'Correo', key: 'correo', width: 25 },
                { header: 'Firma', key: 'firma', width: 30 }
            ];

            currentAsistentes.forEach((a, index) => {
                const row = worksheet.addRow({
                    no: index + 1, grado: a.grado, nombres: a.nombre_apellidos,
                    cargo: a.cargo, dependencia: a.dependencia, tel: a.telefono, correo: a.correo
                });
                row.height = 45;
                if (a.firma_base64) {
                    const imageId = workbook.addImage({ base64: a.firma_base64, extension: 'png' });
                    worksheet.addImage(imageId, {
                        tl: { col: 7, row: row.number - 1 },
                        ext: { width: 150, height: 45 }
                    });
                }
            });

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Asistencia_${currentReunion.numero_control}.xlsx`;
            link.click();
        };
    </script>
</body>
</html>
